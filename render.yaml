services:
  - type: web
    name: satquery-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: ENVIRONMENT
        value: "production"
      - key: DATABASE_URL
        value: "sqlite:///./satquery_dev.db"
      - key: TASK_BACKEND
        value: "inline"
      - key: STORAGE_BACKEND
        value: "local"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://novex-teal.vercel.app,http://localhost:3000,http://localhost:3001"
